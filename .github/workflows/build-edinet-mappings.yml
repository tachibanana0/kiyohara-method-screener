name: Build EDINET Mappings

on:
  schedule:
    # 毎週月曜 05:00 JST (土日の書類提出を月曜朝に取り込む)
    - cron: '0 20 * * 0'
  workflow_dispatch:

concurrency:
  group: jquants-limit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Build edinet_mappings
        env:
          EDINET_SUBSCRIPTION_KEY: ${{ secrets.EDINET_SUBSCRIPTION_KEY }}
          SCREENING_API_URL: ${{ secrets.SCREENING_API_URL }}
          SCREENING_API_TOKEN: ${{ secrets.SCREENING_API_TOKEN }}
          MAPPING_DAYS: '370'
        run: npx tsx scripts/build-edinet-mappings.ts
