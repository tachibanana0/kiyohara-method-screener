name: ZZ Sweep
on:
  workflow_dispatch:
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - env:
          SCREENING_API_URL: ${{ secrets.SCREENING_API_URL }}
          SCREENING_API_TOKEN: ${{ secrets.SCREENING_API_TOKEN }}
        run: |
          echo "--- DRY RUN ---"
          curl -s -X POST "$SCREENING_API_URL/api/picks/sweep" \
            -H "Content-Type: application/json" \
            -H "X-Screening-Token: $SCREENING_API_TOKEN" \
            -d '{"dryRun": true}'
